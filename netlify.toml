[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/spotify/recently-played"
  to = "/.netlify/functions/spotify-recently-played"
  status = 200

[[redirects]]
  from = "/api/letterboxd/recent"
  to = "/.netlify/functions/letterboxd-recent"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
